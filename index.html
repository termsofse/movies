<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .movie-card {
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            min-height: 50px;
        }

        .movie-card:hover {
            background: #e50914;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: #ff4d4d;
        }

        .movie-card:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Movies</h1>

    <div class="movie-grid" id="movie-grid">
        <span class="error-msg">Loading movies...</span>
    </div>

    <script>
        async function loadMovies() {
            const grid = document.getElementById('movie-grid');
            
            try {
                // Fetch the JSON manifest tracking the directories
                const response = await fetch('movies.json');
                if (!response.ok) throw new Error('Could not load movies.json');
                
                const movies = await response.json();
                grid.innerHTML = '';

                if (movies.length === 0) {
                    grid.innerHTML = '<span class="error-msg">No movies found.</span>';
                    return;
                }

                movies.forEach(movie => {
                    const card = document.createElement('a');
                    card.href = movie.path; // Looks up exact directory path from JSON
                    card.className = 'movie-card';
                    card.textContent = movie.title; // Clean, properly capitalized title
                    grid.appendChild(card);
                });

            } catch (err) {
                console.warn('movies.json not found or failed, falling back to directory listing scan...');
                // Fallback: Try fetching index of movies folder or display setup guidance
                grid.innerHTML = '<span class="error-msg">Please ensure movies.json is generated or accessible.</span>';
            }
        }

        loadMovies();
    </script>

</body>
</html>
